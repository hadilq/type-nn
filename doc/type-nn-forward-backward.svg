<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="type-nn: forward, backward and the three scaling problems">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ee0a3"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f0a05a"/></marker>
    <style>
      .t  { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e8edf4; }
      .d  { font-family: ui-sans-serif, system-ui, sans-serif; fill: #8b98a8; font-size: 14px; }
      .m  { font-family: ui-serif, Georgia, serif; fill: #e8edf4; }
      .h  { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2px; }
      .box { fill: #1a232e; stroke: #3d8f6a; }
      .obox { fill: #1a232e; stroke: #b0703a; }
      .pbox { fill: #141b24; stroke: #6b7a8c; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0b0f14"/>
  <rect x="30" y="30" width="1540" height="940" rx="18" fill="#121820" stroke="#2a3544"/>
  <text x="64" y="84" class="h" fill="#7ee0a3" font-size="24">TYPE-NN</text>
  <text x="196" y="84" class="d" font-size="16">a stack of partition functions · the output of one layer is the input of the next</text>

  <!-- FORWARD -->
  <text x="64" y="140" class="h" fill="#7ee0a3" font-size="20">FORWARD  (one layer, unit k)</text>
  <rect x="64" y="165" width="130" height="90" rx="10" class="box"/>
  <text x="129" y="208" text-anchor="middle" class="m" font-size="24">x</text>
  <text x="129" y="236" text-anchor="middle" class="d">incoming type</text>
  <line x1="200" y1="210" x2="250" y2="210" stroke="#7ee0a3" stroke-width="2" marker-end="url(#g)"/>
  <rect x="256" y="165" width="250" height="90" rx="10" class="box"/>
  <text x="381" y="192" text-anchor="middle" class="t" font-size="13" font-weight="700">OR · sum type</text>
  <text x="381" y="228" text-anchor="middle" class="m" font-size="19">Orₖᵣ = wₖᵣ · x + bₖᵣ</text>
  <line x1="512" y1="210" x2="562" y2="210" stroke="#7ee0a3" stroke-width="2" marker-end="url(#g)"/>
  <rect x="568" y="165" width="300" height="90" rx="10" class="box"/>
  <text x="718" y="192" text-anchor="middle" class="t" font-size="13" font-weight="700">AND · product type · a ≥ 1</text>
  <text x="718" y="230" text-anchor="middle" class="m" font-size="20">Aₖ = Πᵣ (Orₖᵣ)^aₖᵣ</text>
  <line x1="874" y1="210" x2="924" y2="210" stroke="#7ee0a3" stroke-width="2" marker-end="url(#g)"/>
  <rect x="930" y="165" width="330" height="90" rx="10" class="box"/>
  <text x="1095" y="192" text-anchor="middle" class="t" font-size="13" font-weight="700">PARTITION FUNCTION · natural log</text>
  <text x="1095" y="230" text-anchor="middle" class="m" font-size="20">zₖ = sign(Aₖ) ln(1 + |Aₖ|)</text>
  <line x1="1266" y1="210" x2="1316" y2="210" stroke="#7ee0a3" stroke-width="2" marker-end="url(#g)"/>
  <rect x="1322" y="165" width="210" height="90" rx="10" class="box"/>
  <text x="1427" y="204" text-anchor="middle" class="m" font-size="20">next layer</text>
  <text x="1427" y="232" text-anchor="middle" class="d">z is its x (dense)</text>
  <text x="64" y="288" class="d">evaluated in log space: ℓ = Σ a ln|Or|, s = Π sign(Or), z = s·ln(1+e^ℓ), so a deep product never overflows. Birth depth = round(ln(1 + n·m)).</text>

  <!-- BACKWARD -->
  <text x="64" y="345" class="h" fill="#f0a05a" font-size="20">BACKWARD</text>
  <rect x="64" y="370" width="1468" height="92" rx="10" class="obox"/>
  <text x="90" y="404" class="m" font-size="19">∂z/∂A = 1/(1+|A|)</text>
  <text x="330" y="404" class="m" font-size="19">∂z/∂Orᵣ = s·σ(ℓ)·aᵣ/Orᵣ  (cofactor Π_{q≠r}, finite at 0)</text>
  <text x="1010" y="404" class="m" font-size="19">∂z/∂aᵣ = s·σ(ℓ)·ln|Orᵣ|</text>
  <text x="90" y="442" class="m" font-size="19">∂Or/∂wⱼ = xⱼ,  ∂Or/∂b = 1</text>
  <text x="400" y="442" class="m" font-size="19">∂L/∂xⱼ = Σ δₖᵣ wₖᵣⱼ (pre-update weights)</text>
  <text x="900" y="442" class="m" font-size="19">one Adam step per Or;  a ← max(1, a − step)</text>
  <line x1="1500" y1="480" x2="120" y2="480" stroke="#f0a05a" stroke-width="2" marker-end="url(#o)"/>

  <!-- SCALING -->
  <text x="64" y="535" class="h" fill="#7ee0a3" font-size="20">THE THREE SCALING PROBLEMS · one dummy rule</text>
  <text x="64" y="562" class="d">A probe is an identity. Back-prop may move it. Moved past θ = lr·age^¾ → promoted, and a fresh probe replaces it. Late, anything inside the band is dropped.</text>

  <!-- Or -->
  <rect x="64" y="585" width="470" height="250" rx="12" fill="#161e28" stroke="#2a3544"/>
  <text x="84" y="615" class="h" fill="#7ee0a3" font-size="16">OR · width</text>
  <circle cx="130" cy="670" r="16" class="box"/><circle cx="130" cy="715" r="16" class="box"/>
  <circle cx="130" cy="760" r="16" class="pbox"/>
  <text x="130" y="807" text-anchor="middle" class="d">layer ℓ−1</text>
  <circle cx="330" cy="690" r="16" class="box"/><circle cx="330" cy="740" r="16" class="box"/>
  <text x="330" y="807" text-anchor="middle" class="d">layer ℓ</text>
  <line x1="146" y1="670" x2="314" y2="690" stroke="#3d8f6a"/><line x1="146" y1="670" x2="314" y2="740" stroke="#3d8f6a"/>
  <line x1="146" y1="715" x2="314" y2="690" stroke="#3d8f6a"/><line x1="146" y1="715" x2="314" y2="740" stroke="#3d8f6a"/>
  <line x1="146" y1="760" x2="314" y2="690" stroke="#6b7a8c" stroke-dasharray="5 4"/>
  <line x1="146" y1="760" x2="314" y2="740" stroke="#6b7a8c" stroke-dasharray="5 4"/>
  <text x="360" y="665" class="d">new coordinate,</text>
  <text x="360" y="685" class="d">trained in ℓ−1;</text>
  <text x="360" y="715" class="d">weights in ℓ</text>
  <text x="360" y="735" class="d">born at 0</text>
  <text x="360" y="770" class="d">drop: outgoing</text>
  <text x="360" y="790" class="d">weights in band</text>

  <!-- And -->
  <rect x="565" y="585" width="470" height="250" rx="12" fill="#161e28" stroke="#2a3544"/>
  <text x="585" y="615" class="h" fill="#7ee0a3" font-size="16">AND · degree</text>
  <text x="760" y="690" text-anchor="middle" class="m" font-size="22">A = Or₁^a₁ · Or₂^a₂ ·</text><text x="905" y="690" class="m" font-size="22" fill="#8b98a8">Ōr^ā</text>
  <text x="800" y="725" text-anchor="middle" class="d">probe Ōr: w ≈ 0, b ≈ 1  ⇒  Ōr^ā = 1 for any ā</text>
  <text x="800" y="765" text-anchor="middle" class="d">promoted → a new probe is appended</text>
  <text x="800" y="790" text-anchor="middle" class="d">drop: an Or back inside the identity band</text>

  <!-- Depth -->
  <rect x="1066" y="585" width="466" height="250" rx="12" fill="#161e28" stroke="#2a3544"/>
  <text x="1086" y="615" class="h" fill="#7ee0a3" font-size="16">DEPTH · layers</text>
  <rect x="1100" y="660" width="70" height="90" rx="8" class="box"/>
  <rect x="1200" y="660" width="70" height="90" rx="8" class="pbox"/>
  <rect x="1300" y="660" width="70" height="90" rx="8" class="box"/>
  <rect x="1400" y="660" width="70" height="90" rx="8" class="box"/>
  <text x="1235" y="700" text-anchor="middle" class="m" font-size="16">xₖ</text>
  <text x="1235" y="722" text-anchor="middle" class="d">identity</text>
  <line x1="1170" y1="705" x2="1198" y2="705" stroke="#6b7a8c"/><line x1="1270" y1="705" x2="1298" y2="705" stroke="#6b7a8c"/>
  <line x1="1370" y1="705" x2="1398" y2="705" stroke="#3d8f6a"/>
  <text x="1300" y="780" text-anchor="middle" class="d">probe sits in the gap with the largest |∂L/∂x|</text>
  <text x="1300" y="802" text-anchor="middle" class="d">(between any two layers); the next layer folds</text>
  <text x="1300" y="822" text-anchor="middle" class="d">x ≈ αF(x)+β so insert/drop is near-exact</text>

  <!-- SCHEDULE -->
  <text x="64" y="858" class="h" fill="#7ee0a3" font-size="16">SCHEDULE</text><text x="64" y="886" class="d">u = step / total</text>
  <rect x="320" y="866" width="400" height="30" fill="#1f5b40"/><text x="520" y="887" text-anchor="middle" class="t" font-size="14">grow (while residual &gt; Var(t)/N)</text>
  <rect x="720" y="866" width="400" height="30" fill="#2a3544"/><text x="920" y="887" text-anchor="middle" class="t" font-size="14">fit</text>
  <rect x="1120" y="866" width="400" height="30" fill="#6a3f1f"/><text x="1320" y="887" text-anchor="middle" class="t" font-size="14">prune</text>
  <text x="320" y="920" class="d">0</text><text x="712" y="920" class="d">⅓</text><text x="1112" y="920" class="d">⅔</text><text x="1508" y="920" class="d">1</text>
  <text x="64" y="950" class="d">All edits happen at epoch boundaries from back-prop statistics on training samples. No dataset name, cap, or hold-out value is read.</text>
</svg>
